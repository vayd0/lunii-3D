<script type="text/x-dc" data-dc-script data-props='{"bg":{"editor":"color","default":"#10131F","options":["#10131F","#FFF9EF","#1B1636","#2B3242"]},"anim":{"editor":"boolean","default":true},"rotate":{"editor":"range","min":-45,"max":45,"step":5,"unit":"°","default":0},"tilt":{"editor":"range","min":-10,"max":20,"step":1,"unit":"°","default":0},"zoom":{"editor":"range","min":-1.5,"max":1.5,"step":0.1,"default":0},"exposure":{"editor":"range","min":0.6,"max":1.3,"step":0.02,"default":0.92},"bloom":{"editor":"range","min":0,"max":0.4,"step":0.01,"default":0.04},"curve":{"editor":"range","min":0,"max":3,"step":0.1,"default":0.6},"$preview":{"width":1200,"height":1200}}'>
class Component extends DCLogic {
  canvasEl = null;
  started = false;
  mounted = false;
  dragging = false;
  moved = 0;
  lastX = 0;
  lastY = 0;
  rotY = 0;
  rotX = 0;
  velY = 0;
  touched = false;
  jumpReq = false;
  nextBlink = 0;
  blinkStart = -1e9;

  setCanvas = (el) => {
    this.canvasEl = el;
    if (el) this.tryInit();
  };

  onDown = (e) => {
    this.dragging = true;
    this.moved = 0;
    this.lastX = e.clientX;
    this.lastY = e.clientY;
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
  };

  onMove = (e) => {
    if (!this.dragging) return;
    const dx = e.clientX - this.lastX;
    const dy = e.clientY - this.lastY;
    this.lastX = e.clientX;
    this.lastY = e.clientY;
    this.moved += Math.abs(dx) + Math.abs(dy);
    if (this.moved > 4) this.touched = true;
    this.rotY = Math.max(-0.85, Math.min(0.85, this.rotY - dx * 0.006));
    this.velY = 0;
    this.rotX = Math.max(-0.25, Math.min(0.5, this.rotX + dy * 0.004));
  };

  onUp = () => { this.dragging = false; };

  componentDidMount() {
    this.mounted = true;
    this.tryInit();
  }

  componentWillUnmount() {
    this.mounted = false;
    clearTimeout(this.retry);
    cancelAnimationFrame(this.raf);
    if (this.ro) this.ro.disconnect();
    if (this.rts) this.rts.forEach((r) => r.dispose());
    if (this.renderer) this.renderer.dispose();
  }

  tryInit() {
    if (this.started || !this.mounted || !this.canvasEl) return;
    if (!window.THREE) {
      clearTimeout(this.retry);
      this.retry = setTimeout(() => this.tryInit(), 100);
      return;
    }
    this.started = true;
    this.init();
  }

  init() {
    const THREE = window.THREE;
    const canvas = this.canvasEl;
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.renderer = renderer;
    let ppResize = null;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xdfe5ea);
    scene.fog = new THREE.Fog(0xdfe5ea, 600, 3800);
    const camera = new THREE.PerspectiveCamera(52, 1, 0.2, 4200);
    const camTarget = new THREE.Vector3(-2.9, 2.25, -1.25);
    // caméra embarquée : dérive lente, vibrations de la route, cahots, roulis dans les virages
    const camLook = new THREE.Vector3();
    const cam = { bump: 0, bumpAt: -1, nextBump: 2.5, prevBump: 0, kick: 0 };
    const placeCam = (ts) => {
      const mov = ts != null && (this.props.anim ?? true);
      const T = mov ? ts : 0;
      if (mov) {
        if (T > cam.nextBump) { cam.bumpAt = T; cam.nextBump = T + 2.2 + Math.random() * 4; cam.amp = 0.03 + Math.random() * 0.035; }
        const u = T - cam.bumpAt;
        cam.bump = cam.bumpAt >= 0 && u < 0.9 ? -cam.amp * Math.exp(-u * 5.5) * Math.sin(u * 26) : 0;
      } else cam.bump = 0;
      cam.kick = (cam.bump - cam.prevBump) * 60;
      cam.prevBump = cam.bump;
      const yaw = 0.8 + this.rotY + (mov ? Math.sin(T * 0.31) * 0.085 + Math.sin(T * 0.13 + 1.2) * 0.05 : 0);
      const pitch = Math.max(-0.3, Math.min(0.6, -0.02 + this.rotX + (mov ? Math.sin(T * 0.23 + 0.5) * 0.03 : 0)));
      const r = 4.2 - (this.props.zoom || 0) * 0.6 + (mov ? Math.sin(T * 0.19 + 2.0) * 0.18 : 0);
      camera.position.set(
        camTarget.x + r * Math.cos(pitch) * Math.sin(yaw),
        camTarget.y + r * Math.sin(pitch),
        camTarget.z + r * Math.cos(pitch) * Math.cos(yaw)
      );
      if (mov) {
        camera.position.x += Math.sin(T * 9.3 + 0.3) * 0.006;
        camera.position.y += Math.sin(T * 13.7) * 0.007 + Math.sin(T * 23.1 + 0.7) * 0.004 + cam.bump;
      }
      camLook.copy(camTarget);
      if (mov) { camLook.x += Math.sin(T * 0.27) * 0.12; camLook.y += Math.sin(T * 0.21 + 0.8) * 0.06 + cam.bump * 0.6; }
      camera.lookAt(camLook);
      if (mov) camera.rotateZ(Math.sin(T * 0.17) * 0.014 + Math.sin(T * 0.41 + 0.9) * 0.005);
    };
    placeCam();

    const resize = () => {
      const w = canvas.clientWidth || 1200;
      const h = canvas.clientHeight || 1200;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      if (ppResize) ppResize(w, h);
    };
    resize();
    if (window.ResizeObserver) {
      this.ro = new ResizeObserver(resize);
      this.ro.observe(canvas);
    }

    scene.add(new THREE.HemisphereLight(0xd6e6ff, 0x9a8462, 0.62));
    scene.add(new THREE.AmbientLight(0xffffff, 0.14));
    const key = new THREE.DirectionalLight(0xffe2b6, 0.68);
    const sunDir = new THREE.Vector3(-0.82, 0.42, 0.4).normalize();
    key.target.position.set(-0.8, 1.3, -0.2);
    key.position.copy(key.target.position).addScaledVector(sunDir, 16);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -5.5; key.shadow.camera.right = 5.5;
    key.shadow.camera.top = 5.5; key.shadow.camera.bottom = -5.5;
    key.shadow.camera.near = 2; key.shadow.camera.far = 32;
    key.shadow.bias = -0.0004;
    key.shadow.normalBias = 0.025;
    key.shadow.radius = 3;
    scene.add(key);
    scene.add(key.target);
    const fill = new THREE.DirectionalLight(0xb9cdf5, 0.16);
    fill.position.set(4, 3, 6);
    scene.add(fill);

    // Grain façon illustration
    const gc = document.createElement('canvas');
    gc.width = gc.height = 128;
    const gx = gc.getContext('2d');
    const img = gx.createImageData(128, 128);
    for (let i = 0; i < 128 * 128; i++) {
      const v = 226 + Math.random() * 29;
      img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
      img.data[i * 4 + 3] = 255;
    }
    gx.putImageData(img, 0, 0);
    const grain = new THREE.CanvasTexture(gc);
    grain.wrapS = grain.wrapT = THREE.RepeatWrapping;
    grain.repeat.set(3, 3);

    const gm = new THREE.DataTexture(new Uint8Array([150, 150, 150, 255, 205, 205, 205, 255, 255, 255, 255, 255]), 3, 1, THREE.RGBAFormat);
    gm.minFilter = THREE.NearestFilter;
    gm.magFilter = THREE.NearestFilter;
    gm.generateMipmaps = false;
    gm.needsUpdate = true;
    const toon = (c, extra) => new THREE.MeshToonMaterial(Object.assign({ color: c, gradientMap: gm, map: grain }, extra || {}));
    const flat = (c) => new THREE.MeshBasicMaterial({ color: c });

    const M = {
      teal: toon(0x1fae9f),
      tealSide: toon(0x138c84),
      white: flat(0xfcfaf3),
      pupil: toon(0x2b1913, { map: null }),
      pupilHi: flat(0xffffff),
      mouth: flat(0x0f5a57),
      mouthIn: flat(0x177571),
      brow: flat(0x0f6460),
      cap: toon(0xa884f7, { side: THREE.DoubleSide }),
      visor: toon(0x8b5fef, { side: THREE.DoubleSide }),
      visorUnder: toon(0x6a44d8, { side: THREE.DoubleSide }),
      boot: toon(0xf2581f),
      sole: toon(0xc93e12),
      lace: toon(0xffb27a),
      sock: toon(0xff8c2e),
      sockBand: toon(0xffb066),
      pole: toon(0xf3f5f8, { map: null }),
      seam: flat(0x7350dc)
    };
    const peach = new THREE.Color(0xf9c48e);
    const orange = new THREE.Color(0xff7a2e);

    const sph = new THREE.SphereGeometry(1, 32, 20);
    const add = (geo, mat, parent, pos, scale, rot) => {
      const m = new THREE.Mesh(geo, mat);
      if (pos) m.position.set(pos[0], pos[1], pos[2]);
      if (scale) m.scale.set(scale[0], scale[1], scale[2]);
      if (rot) m.rotation.set(rot[0], rot[1], rot[2]);
      parent.add(m);
      return m;
    };
    const UP = new THREE.Vector3(0, 1, 0);
    const tmpV = new THREE.Vector3();
    const setSeg = (mesh, A, B) => {
      mesh.position.copy(A).add(B).multiplyScalar(0.5);
      tmpV.copy(B).sub(A).normalize();
      mesh.quaternion.setFromUnitVectors(UP, tmpV);
    };

    const root = new THREE.Group();
    scene.add(root);
    const char = new THREE.Group();
    const CHAR_Y = 0.70;
    char.position.set(-1.6, CHAR_Y, -0.65);
    char.rotation.y = -0.4;
    char.scale.setScalar(0.74);
    root.add(char);
    const torso = new THREE.Group();
    torso.rotation.z = 0.05;
    char.add(torso);
    const squash = new THREE.Group();
    torso.add(squash);

    // ---- Corps : bloc arrondi
    const BW = 0.68, BH = 1.05, BR = 0.36;
    const s = new THREE.Shape();
    s.moveTo(-BW + BR, -BH); s.lineTo(BW - BR, -BH); s.quadraticCurveTo(BW, -BH, BW, -BH + BR);
    s.lineTo(BW, BH - BR); s.quadraticCurveTo(BW, BH, BW - BR, BH);
    s.lineTo(-BW + BR, BH); s.quadraticCurveTo(-BW, BH, -BW, BH - BR);
    s.lineTo(-BW, -BH + BR); s.quadraticCurveTo(-BW, -BH, -BW + BR, -BH);
    const bodyGeo = new THREE.ExtrudeGeometry(s, { depth: 0.5, bevelEnabled: true, bevelThickness: 0.2, bevelSize: 0.13, bevelSegments: 8, curveSegments: 20 });
    bodyGeo.translate(0, 1.18, -0.25);
    add(bodyGeo, [M.teal, M.tealSide], squash);
    const FZ = 0.45;
    const TOP = 2.36;

    // ---- Visage
    const eyes = [
      { x: -0.32, y: 1.56, rx: 0.29, ry: 0.37, px: -0.05 },
      { x: 0.33, y: 1.58, rx: 0.33, ry: 0.41, px: -0.08 }
    ];
    const eyeGroups = [];
    eyes.forEach((e) => {
      const eg = new THREE.Group();
      eg.position.set(e.x, e.y, 0);
      squash.add(eg);
      eyeGroups.push(eg);
      add(sph, M.white, eg, [0, 0, FZ - 0.02], [e.rx, e.ry, 0.1]);
      add(sph, M.pupil, eg, [e.px, -0.03, FZ + 0.035], [e.rx * 0.62, e.ry * 0.64, 0.07]);
    });
    const bs = new THREE.Shape();
    bs.moveTo(-0.17, -0.05);
    bs.quadraticCurveTo(0, 0.19, 0.17, -0.05);
    bs.quadraticCurveTo(0, 0.07, -0.17, -0.05);
    const browGeo = new THREE.ShapeGeometry(bs, 20);
    add(browGeo, M.brow, squash, [-0.34, 2.02, FZ + 0.012], [1.05, 0.95, 1], [0, 0, 0.16]);
    const ms = new THREE.Shape();
    ms.moveTo(-0.18, 0.06);
    ms.quadraticCurveTo(0, 0.0, 0.18, 0.06);
    ms.bezierCurveTo(0.15, -0.13, -0.15, -0.13, -0.18, 0.06);
    const mouthG = new THREE.Group();
    mouthG.position.set(-0.06, 1.12, 0);
    mouthG.rotation.z = 0.12;
    squash.add(mouthG);
    add(new THREE.ShapeGeometry(ms, 16), M.mouth, mouthG, [0, -0.04, FZ + 0.004]);
    const mi = new THREE.Shape();
    mi.moveTo(-0.08, -0.07);
    mi.quadraticCurveTo(0, -0.02, 0.09, -0.06);
    mi.quadraticCurveTo(0.02, -0.14, -0.08, -0.07);
    add(new THREE.ShapeGeometry(mi, 12), M.mouthIn, mouthG, [0, -0.04, FZ + 0.008]);

    // ---- Haut de la tête : cheveux souples + casquette
    const head = new THREE.Group();
    torso.add(head);
    // Cheveux : une seule masse pêche, d'où partent de larges mèches souples
    const hairBase = toon(0xf9c48e);
    hairBase.userData.hair = true;
    const hairMat = toon(0xffffff, { vertexColors: true });
    hairMat.userData.hair = true;
    hairMat.userData.ol = new THREE.Color(0xfc9f5e);
    // volume sur le crâne + cheveux courts derrière et sur les côtés (formes lisses, sans pointes)
    // le volume épouse le crâne : même section que le corps, gonflée, coupée à la ligne de cheveux
    const HE = 0.055, BTOP = -0.13, YC = -0.34;
    const CX = BW - BR, CY = BTOP - BR, RR = BR + HE;
    const a2 = Math.asin((YC - CY) / RR), N = 14;
    const hsh = new THREE.Shape();
    hsh.moveTo(-CX - RR * Math.cos(a2), YC);
    for (let i = 1; i <= N; i++) {
      const a = (Math.PI - a2) + (a2 - Math.PI / 2) * (i / N);
      hsh.lineTo(-CX + RR * Math.cos(a), CY + RR * Math.sin(a));
    }
    for (let i = 1; i <= N; i++) {
      const a = Math.PI / 2 - (Math.PI / 2 - a2) * (i / N);
      hsh.lineTo(CX + RR * Math.cos(a), CY + RR * Math.sin(a));
    }
    hsh.closePath();
    const hairGeo = new THREE.ExtrudeGeometry(hsh, { depth: 0.5, bevelEnabled: true, bevelThickness: 0.2 + HE, bevelSize: 0.13, bevelSegments: 8, curveSegments: 12 });
    hairGeo.translate(0, 0, -0.25);
    // la ligne de cheveux remonte vers l'avant : le front reste dégagé, la nuque couverte
    const hp = hairGeo.attributes.position;
    for (let i = 0; i < hp.count; i++) {
      const y = hp.getY(i);
      if (y > YC + 0.15) continue;
      const u = Math.max(0, Math.min(1, (hp.getZ(i) + 0.08) / 0.5));
      hp.setY(i, y + 0.2 * u * u * (3 - 2 * u));
    }
    hairGeo.computeVertexNormals();
    add(hairGeo, hairBase, head, null, null, [-0.07, 0, 0]);

    // mèche = lame souple d'un seul tenant, large à la base, pointue au bout
    const locks = [];
    const NR = 18, NS = 12;
    const updLock = (L) => {
      const o = L.o, pos = L.pos, seg = o.len / NR;
      let x = 0, y = 0;
      for (let i = 0; i <= NR; i++) {
        const u = i / NR;
        const th = o.rz + o.curve * u + L.a * Math.pow(u, 1.3);
        const tx = -Math.sin(th), ty = Math.cos(th);
        if (i > 0) { x += tx * seg; y += ty * seg; }
        const w = Math.max(0.004, o.w * Math.pow(1 - u, 0.65) * (0.72 + 0.28 * Math.sin(Math.min(1, u * 3) * Math.PI / 2)));
        const th2 = Math.max(0.004, o.t * Math.pow(1 - u, 0.6));
        const nx = Math.cos(th), ny = Math.sin(th);
        for (let j = 0; j < NS; j++) {
          const ph = (j / NS) * Math.PI * 2, k = (i * NS + j) * 3;
          const cw = Math.cos(ph) * w;
          pos[k] = x + cw * nx;
          pos[k + 1] = y + cw * ny;
          pos[k + 2] = Math.sin(ph) * th2;
        }
      }
      L.g.attributes.position.needsUpdate = true;
      L.g.computeVertexNormals();
    };
    const mkLock = (o) => {
      const g = new THREE.BufferGeometry();
      const n = (NR + 1) * NS;
      const pos = new Float32Array(n * 3), col = new Float32Array(n * 3), uv = new Float32Array(n * 2);
      const idx = [];
      const c = new THREE.Color();
      for (let i = 0; i <= NR; i++) {
        const u = i / NR;
        for (let j = 0; j < NS; j++) {
          const k = i * NS + j;
          const ph = (j / NS) * Math.PI * 2;
          const side = (1 - Math.cos(ph)) / 2;
          const lo = Math.max(0, Math.min(1, (side - 0.32) / 0.4));
          const mix = Math.min(1, lo * lo * (3 - 2 * lo) * (0.55 + 0.45 * u) + 0.2 * u * u);
          c.lerpColors(peach, orange, mix * (o.or == null ? 1 : o.or));
          col[k * 3] = c.r; col[k * 3 + 1] = c.g; col[k * 3 + 2] = c.b;
          uv[k * 2] = (j / NS) * 2; uv[k * 2 + 1] = u * 3;
          if (i < NR) {
            const a = k, b = i * NS + ((j + 1) % NS), d = a + NS, e = b + NS;
            idx.push(a, d, b, b, d, e);
          }
        }
      }
      g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      g.setAttribute('color', new THREE.BufferAttribute(col, 3));
      g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
      g.setIndex(idx);
      const m = new THREE.Mesh(g, hairMat);
      m.frustumCulled = false;
      m.position.set(o.p[0], o.p[1], o.p[2]);
      m.rotation.y = o.ry || 0;
      head.add(m);
      const L = { o: o, g: g, pos: pos, a: 0, v: 0, k: o.k || 1 };
      updLock(L);
      locks.push(L);
    };
    // grande houppe : quatre mèches en éventail qui partent de sous la casquette vers l'arrière-gauche
    mkLock({ p: [0.3, 0.14, -0.1], rz: 0.5, curve: 0.75, len: 1.0, w: 0.39, t: 0.18 });
    mkLock({ p: [0.2, 0.12, 0.24], rz: 0.82, curve: 0.75, len: 1.5, w: 0.47, t: 0.19 });
    mkLock({ p: [0.06, 0.04, 0.12], rz: 1.18, curve: 0.7, len: 1.38, w: 0.44, t: 0.18 });
    mkLock({ p: [-0.1, -0.04, 0.0], rz: 1.5, curve: 0.55, len: 1.1, w: 0.39, t: 0.17 });
    // une seule mèche large sur le front, qui glisse entre les yeux
    mkLock({ p: [0.34, 0.04, 0.47], rz: Math.PI - 0.6, curve: -0.4, len: 0.58, w: 0.31, t: 0.07, k: 0.35, or: 0.5 });

    const cap = new THREE.Group();
    cap.position.set(0.42, 0.1, -0.1);
    cap.rotation.order = "ZXY";
    cap.rotation.set(0.1, 1.1, -0.5);
    head.add(cap);
    // le dôme garde son orientation d'origine (il couvre bien les cheveux) ; seule la visière tourne vers l'arrière
    const capDome = new THREE.Group();
    capDome.rotation.y = -1.35;
    capDome.scale.set(1.12, 1.08, 1.14);
    capDome.position.y = -0.04;
    cap.add(capDome);
    add(new THREE.SphereGeometry(0.72, 40, 20, 0, Math.PI * 2, 0, Math.PI / 2), M.cap, capDome, null, [1, 0.74, 0.8]);
    add(sph, M.visor, capDome, [0, 0.53, 0], [0.07, 0.04, 0.07]);
    const visor = new THREE.Group();
    visor.position.set(0.52, 0.02, 0.04);
    visor.rotation.set(0, -0.5, -0.08);
    cap.add(visor);
    add(new THREE.CylinderGeometry(0.6, 0.6, 0.045, 40, 1, false, 0, Math.PI), M.visor, visor, null, [1.15, 1, 0.95]);
    add(new THREE.CylinderGeometry(0.6, 0.6, 0.02, 40, 1, false, 0, Math.PI), M.visorUnder, visor, [0, -0.03, 0], [1.13, 1, 0.93]);
    const seams = new THREE.Group();
    seams.scale.set(1, 0.74, 0.8);
    capDome.add(seams);
    [0, Math.PI / 3, -Math.PI / 3].forEach((a) => add(new THREE.TorusGeometry(0.722, 0.012, 6, 56, Math.PI), M.seam, seams, null, null, [0, a, 0]));
    add(new THREE.TorusGeometry(0.72, 0.035, 8, 56), M.visor, seams, [0, 0.03, 0], null, [Math.PI / 2, 0, 0]);

    // ---- Casque audio : écouteurs turquoise cerclés de jaune, arceau qui passe par-dessus la casquette
    const HPM = { band: toon(0x168a83), cup: toon(0x1fae9f), rim: toon(0xf0b232), pad: toon(0x116e69) };

      skyClouds.add(sp);
    };
    for (let k = 0; k < 4; k++) mkCloud(-2.9 + (k / 8) * 1.3 + rr(-0.05, 0.05), rr(1500, 1950), rr(0.09, 0.17), rr(320, 560));
    for (let k = 0; k < 5; k++) mkCloud(rnd() * TAU, rr(1600, 2000), rr(0.14, 0.3), rr(360, 600));

    // plancher + plafond
    add(roundBox(5.8, 0.2, 7.6, 0.1), C.floor, car, [0, -0.1, 0.4]);
    // pavillon bombé (arc parabolique, épaisseur constante)
    const roof = new THREE.Shape();
    const RW = 2.98, RY = 3.34, RH = 0.46, RT = 0.2, RS = 24;
    for (let k = 0; k <= RS; k++) {
      const x = -RW + (2 * RW * k) / RS;
      const y = RY + RH * (1 - (x / RW) * (x / RW));
      if (k === 0) roof.moveTo(x, y); else roof.lineTo(x, y);
    }
    for (let k = RS; k >= 0; k--) {
      const x = -RW + (2 * RW * k) / RS;
      roof.lineTo(x, RY + RT + RH * (1 - (x / RW) * (x / RW)));
    }
    const roofGeo = new THREE.ExtrudeGeometry(roof, { depth: 7.6, bevelEnabled: false, curveSegments: 4 });
    roofGeo.translate(0, 0, -3.8);
    add(roofGeo, C.ceil, car, [0, 0, 0.4]);
    // nervures du pavillon
    [-1.6, 0.6, 2.8].forEach((z) => {
      const rib = new THREE.Shape();
      for (let k = 0; k <= RS; k++) {
        const x = -RW + (2 * RW * k) / RS;
        const y = RY - 0.05 + RH * (1 - (x / RW) * (x / RW));
        if (k === 0) rib.moveTo(x, y); else rib.lineTo(x, y);
      }
      for (let k = RS; k >= 0; k--) {
        const x = -RW + (2 * RW * k) / RS;
        rib.lineTo(x, RY + 0.06 + RH * (1 - (x / RW) * (x / RW)));
      }
      const rg = new THREE.ExtrudeGeometry(rib, { depth: 0.12, bevelEnabled: false, curveSegments: 4 });
      add(rg, C.seatDark, car, [0, 0, z]);
    });

    // banquette arrière, trois places
    add(roundBox(5.1, 0.58, 0.78, 0.2), C.seat, car, [0, 0.53, -0.88]);
    add(roundBox(5.1, 1.8, 0.42, 0.22), C.seat, car, [0, 1.6, -1.32], null, [-0.09, 0, 0]);
    [-0.85, 0.85].forEach((x) => {
      add(roundBox(0.06, 0.52, 0.75, 0.03), C.seam, car, [x, 0.58, -0.88]);
      add(roundBox(0.06, 1.7, 0.44, 0.03), C.seam, car, [x, 1.6, -1.31], null, [-0.09, 0, 0]);
    });
    [-1.7, 0, 1.7].forEach((x) => add(roundBox(0.95, 0.44, 0.34, 0.16), C.seatDark, car, [x, 2.66, -1.36], null, [-0.09, 0, 0]));

    // portières, encadrement de vitres avec montants, vitres arrondies
    [-1, 1].forEach((g) => {
      add(roundBox(0.16, 1.4, 7.4, 0.12), C.panel, car, [g * 2.8, 0.65, 0.75]);
      add(roundBox(0.36, 0.26, 1.6, 0.1), C.trim, car, [g * 2.63, 1.08, -0.65]);
      const band = roundPath(0.75, 2.4, 7.4, 2.42, 0.3, THREE.Shape);
      band.holes.push(roundPath(-1.12, 2.33, 3.2, 1.96, 0.44, THREE.Path));
      band.holes.push(roundPath(2.48, 2.33, 3.2, 1.96, 0.44, THREE.Path));
      const fr = new THREE.ExtrudeGeometry(band, { depth: 0.14, bevelEnabled: true, bevelThickness: 0.04, bevelSize: 0.04, bevelSegments: 2, curveSegments: 10 });
      fr.translate(0, 0, -0.07);
      add(fr, C.pillar, car, [g * 2.8, 0, 0], null, [0, g * Math.PI / 2, 0]);
      [[-1.12, 3.2], [2.48, 3.2]].forEach((o) => {
        const w = add(roundPane(o[1], 1.96, 0.44), glassMat, car, [g * 2.8, 2.33, o[0]], null, [0, g * Math.PI / 2, 0]);
        w.renderOrder = 3;
      });
    });

    // custode arrière, tablette et lunette arrière arrondie
    add(roundBox(5.7, 2.6, 0.2, 0.12), C.panel, car, [0, 1.3, -2.42]);
    add(roundBox(5.2, 0.16, 0.8, 0.08), C.seatDark, car, [0, 2.56, -1.98]);
    const rband = roundPath(0, 3.05, 5.9, 1.6, 0.3, THREE.Shape);
    rband.holes.push(roundPath(0, 3.0, 3.1, 0.78, 0.36, THREE.Path));
    const rfr = new THREE.ExtrudeGeometry(rband, { depth: 0.16, bevelEnabled: true, bevelThickness: 0.04, bevelSize: 0.04, bevelSegments: 2, curveSegments: 10 });
    rfr.translate(0, 0, -0.08);
    add(rfr, C.pillar, car, [0, 0, -2.42]);
    const rw = add(roundPane(3.1, 0.78, 0.36), glassMat, car, [0, 3.0, -2.44]);
    rw.renderOrder = 3;

    // sièges avant, vus de dos
    [-1.7, 1.7].forEach((x) => {
      add(roundBox(1.45, 1.95, 0.45, 0.24), C.seat, car, [x, 1.72, 3.9], null, [0.08, 0, 0]);
      add(roundBox(0.88, 0.48, 0.34, 0.16), C.seatDark, car, [x, 2.92, 3.8], null, [0.08, 0, 0]);
      add(roundBox(1.5, 0.5, 1.25, 0.2), C.seat, car, [x, 0.58, 4.6]);
    });

    // ceinture de sécurité, ancrée côté portière
    const bA = new THREE.Vector3(-0.72, 1.3, 0.5), bB = new THREE.Vector3(0.54, 0.3, 0.52);
    const beltMesh = add(roundBox(0.18, bA.distanceTo(bB), 0.07, 0.03), C.belt, torso);
    beltMesh.position.copy(bA).add(bB).multiplyScalar(0.5);
    beltMesh.rotation.z = Math.atan2(-(bB.x - bA.x), bB.y - bA.y);
    add(roundBox(1.3, 0.17, 0.08, 0.03), C.belt, torso, [-0.08, 0.27, 0.5], null, [0, 0, 0.04]);
    add(roundBox(0.2, 0.28, 0.13, 0.04), C.buckle, torso, [0.58, 0.29, 0.5], null, [0, 0, -0.12]);
    add(roundBox(0.15, 0.55, 0.1, 0.04), C.belt, torso, [-0.73, 1.52, 0.3], null, [0.75, 0, 0.05]);

    // ---- Ombre au sol
    const sc = document.createElement('canvas');
    sc.width = sc.height = 128;
    const sg = sc.getContext('2d');
    const rg = sg.createRadialGradient(64, 64, 0, 64, 64, 64);
    rg.addColorStop(0, 'rgba(0,0,0,0.45)');
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    sg.fillStyle = rg;
    sg.fillRect(0, 0, 128, 128);
    const shadow = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 3.4), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sc), transparent: true, depthWrite: false }));
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.set(-1.6, 0.84, -0.68);
    shadow.scale.set(0.42, 0.36, 1);
    scene.add(shadow);

    // ---- Terre ronde : tout le décor s'incurve avec la distance (shader de courbure)
    const curved = new Set();
    world.traverse((o) => {
      if (!o.isMesh || o === dome || o.userData.noCurve) return;
      const m = o.material;
      if (curved.has(m)) return;
      curved.add(m);
      m.onBeforeCompile = (sh) => {
        sh.uniforms.uCurve = curveU;
        sh.vertexShader = 'uniform float uCurve;\n' + sh.vertexShader.replace('#include <project_vertex>',
          'vec4 cwp = modelMatrix * vec4( transformed, 1.0 );\n' +
          'cwp.y -= dot( cwp.xz, cwp.xz ) * uCurve;\n' +
          'vec4 mvPosition = viewMatrix * cwp;\n' +
          'gl_Position = projectionMatrix * mvPosition;');
      };
      m.customProgramCacheKey = () => 'curved';
      m.needsUpdate = true;
      o.frustumCulled = false;
    });

    // ---- Ombres : voiture et personnage seulement (le soleil entre par les vitres)
    [car, char].forEach((grp) => grp.traverse((o) => {
      if (!o.isMesh || o.userData.isOl) return;
      const m0 = Array.isArray(o.material) ? o.material[0] : o.material;
      if (m0 && m0.transparent) return;
      if (m0 === M.white || m0 === M.pupil) return; // pas d'ombre portée sur les yeux
      o.castShadow = true;
      o.receiveShadow = true;
    }));
    shadow.visible = false;

    // ---- Post-traitement : halo lumineux, compression des hautes lumières, étalonnage, vignettage, grain
    const hdr = renderer.capabilities.isWebGL2 && renderer.extensions.has('EXT_color_buffer_float');
    const rtType = hdr ? THREE.HalfFloatType : THREE.UnsignedByteType;
    const rtScene = new THREE.WebGLRenderTarget(4, 4, { type: rtType, stencilBuffer: true, samples: renderer.capabilities.isWebGL2 ? 4 : 0 });
    const rtA = new THREE.WebGLRenderTarget(4, 4, { type: rtType });
    const rtB = new THREE.WebGLRenderTarget(4, 4, { type: rtType });
    this.rts = [rtScene, rtA, rtB];
    const fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const fsScene = new THREE.Scene();
    const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
    quad.frustumCulled = false;
    fsScene.add(quad);
    const VS = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
    const fsMat = (u, fs) => new THREE.ShaderMaterial({ uniforms: u, vertexShader: VS, fragmentShader: fs, depthTest: false, depthWrite: false });
    const brightMat = fsMat({ tDiffuse: { value: null }, thr: { value: 0.97 } },
      'uniform sampler2D tDiffuse; uniform float thr; varying vec2 vUv;' +
      'void main(){ vec3 c = texture2D(tDiffuse, vUv).rgb; float l = dot(c, vec3(0.299, 0.587, 0.114));' +
      ' gl_FragColor = vec4(c * smoothstep(thr, thr + 0.4, l), 1.0); }');
    const blurMat = fsMat({ tDiffuse: { value: null }, dir: { value: new THREE.Vector2() } },
      'uniform sampler2D tDiffuse; uniform vec2 dir; varying vec2 vUv;' +
      'void main(){ vec3 s = texture2D(tDiffuse, vUv).rgb * 0.2270270270;' +
      ' s += (texture2D(tDiffuse, vUv + dir * 1.3846153846).rgb + texture2D(tDiffuse, vUv - dir * 1.3846153846).rgb) * 0.3162162162;' +
      ' s += (texture2D(tDiffuse, vUv + dir * 3.2307692308).rgb + texture2D(tDiffuse, vUv - dir * 3.2307692308).rgb) * 0.0702702703;' +
      ' gl_FragColor = vec4(s, 1.0); }');
    const compMat = fsMat({ tScene: { value: null }, tBloom: { value: null }, time: { value: 0 }, res: { value: new THREE.Vector2(1, 1) }, expo: { value: 0.92 }, bloomK: { value: 0.04 } },
      'uniform sampler2D tScene; uniform sampler2D tBloom; uniform float time; uniform vec2 res; uniform float expo; uniform float bloomK; varying vec2 vUv;' +
      'float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }' +
      'vec3 shoulder(vec3 c){ vec3 k = 0.7 + 0.3 * (1.0 - exp(-(c - 0.7) / 0.3)); return mix(c, k, step(0.7, c)); }' +
      'void main(){' +
      ' vec3 c = texture2D(tScene, vUv).rgb + texture2D(tBloom, vUv).rgb * bloomK;' +
      ' c = shoulder(max(c * expo, 0.0));' +
      ' float l = dot(c, vec3(0.299, 0.587, 0.114));' +
      ' c = mix(vec3(l), c, 1.08);' +
      ' c += vec3(0.018, 0.008, -0.014) * smoothstep(0.45, 1.0, l) + vec3(-0.012, -0.002, 0.02) * (1.0 - smoothstep(0.0, 0.42, l));' +
      ' c = (c - 0.5) * 1.06 + 0.5;' +
      ' vec2 q = vUv - 0.5; c *= mix(0.72, 1.0, smoothstep(0.82, 0.22, length(q)));' +
      ' c += (hash(vUv * res + fract(time)) - 0.5) * 0.022;' +
      ' gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0); }');
    const bw = { x: 1, y: 1 };
    ppResize = (w, h) => {
      const pr = renderer.getPixelRatio();
      const W = Math.max(4, Math.floor(w * pr)), H = Math.max(4, Math.floor(h * pr));
      rtScene.setSize(W, H);
      bw.x = Math.max(4, Math.floor(W / 4)); bw.y = Math.max(4, Math.floor(H / 4));
      rtA.setSize(bw.x, bw.y); rtB.setSize(bw.x, bw.y);
      compMat.uniforms.res.value.set(W, H);
    };
    resize();
    const pass = (mat, target) => { quad.material = mat; renderer.setRenderTarget(target); renderer.render(fsScene, fsCam); };
    const renderPP = (now) => {
      renderer.setRenderTarget(rtScene);
      renderer.render(scene, camera);
      brightMat.uniforms.tDiffuse.value = rtScene.texture;
      pass(brightMat, rtA);
      for (let k = 1; k <= 2; k++) {
        blurMat.uniforms.tDiffuse.value = rtA.texture; blurMat.uniforms.dir.value.set(k / bw.x, 0); pass(blurMat, rtB);
        blurMat.uniforms.tDiffuse.value = rtB.texture; blurMat.uniforms.dir.value.set(0, k / bw.y); pass(blurMat, rtA);
      }
      compMat.uniforms.tScene.value = rtScene.texture;
      compMat.uniforms.tBloom.value = rtA.texture;
      compMat.uniforms.time.value = now * 0.001;
      compMat.uniforms.expo.value = this.props.exposure ?? 0.92;
      compMat.uniforms.bloomK.value = this.props.bloom ?? 0.04;
      brightMat.uniforms.thr.value = Math.max(0.35, 0.97 - (this.props.bloom ?? 0.04) * 1.5);
      pass(compMat, null);
    };

    // ---- Boucle d'animation
    const S = new THREE.Vector3(), T = new THREE.Vector3(), E = new THREE.Vector3(), dir = new THREE.Vector3(), perp = new THREE.Vector3();
    const POLE = new THREE.Vector3(1, -0.7, -0.5);
    const POLE_L = new THREE.Vector3(-0.8, -0.35, -0.47).normalize();
    const DOWN = new THREE.Vector3(0, -1, 0);
    const HL = new THREE.Vector3(), eA = new THREE.Vector3(), eB = new THREE.Vector3(), eC = new THREE.Vector3();
    const qA = new THREE.Quaternion();
    const solveArm = (g1, g2, Sp, Hp, l1, l2, pole) => {
      eA.copy(Hp).sub(Sp);
      const dd = Math.max(1e-3, Math.min(eA.length(), l1 + l2 - 1e-3));
      eA.normalize();
      const aa = (l1 * l1 - l2 * l2 + dd * dd) / (2 * dd);
      const hh = Math.sqrt(Math.max(0, l1 * l1 - aa * aa));
      eB.copy(pole).addScaledVector(eA, -pole.dot(eA)).normalize();
      eC.copy(Sp).addScaledVector(eA, aa).addScaledVector(eB, hh);
      qA.setFromUnitVectors(DOWN, eB.copy(eC).sub(Sp).normalize());
      g1.quaternion.copy(qA);
      g2.quaternion.setFromUnitVectors(DOWN, eB.copy(Hp).sub(eC).normalize().applyQuaternion(qA.invert()));
    };
    const L1 = 0.53, L2 = 0.5;
    let t = 0;
    let py = 0, pvy = 0, prot = this.rotY;
    let last = performance.now();

    const loop = (now) => {
      if (!this.mounted) return;
      const dt = Math.min(0.04, Math.max(0.001, (now - last) / 1000));
      last = now;
      const anim = this.props.anim ?? true;
      if (anim) t += dt;

      // réglages du panneau (Tweaks)
      const pa = this.props.rotate, pt = this.props.tilt;
      if (pa != null && pa !== this.lastAngle) { this.lastAngle = pa; this.rotY = pa * Math.PI / 180; }
      if (pt != null && pt !== this.lastTilt) { this.lastTilt = pt; this.rotX = pt * Math.PI / 180; }
      placeCam(now * 0.001);

      // assis : respiration + petits cahots de la route
      const sy = 1, sxz = 1;
      squash.scale.set(1, 1, 1);
      char.position.y = CHAR_Y;
      torso.rotation.y = 0;
      torso.rotation.x = -0.13;
      head.position.set(0, TOP, 0);

      // jambes pliées sur l'assise, pieds qui se balancent
      const sitLeg = (leg, g, ph) => {
        leg.hip.rotation.set(-1.25, 0, g * 0.16);
        leg.knee.rotation.x = 0.55;
        leg.ankle.rotation.x = 0.1;
      };
      sitLeg(legL, -1, 0);
      sitLeg(legR, 1, 1.1);

      // bras côté portière : posé sur l'accoudoir
      S.set(-BW - 0.08 * sxz, 1.02 * sy, 0.02);
      shL.position.copy(S);
      HL.set(-1.16, 0.8, 0.55);
      solveArm(shL, elL, S, HL, 0.52, 0.46, POLE_L);
      hand.rotation.set(0, 0, 0);

      // bras droit : IK deux segments, main posée sur la cuisse
      S.set(BW + 0.08 * sxz, 1.0 * sy, 0.02);
      T.set(0.8, 0.14, 0.34);
      dir.copy(T).sub(S);
      let d = Math.min(dir.length(), L1 + L2 - 1e-3);
      dir.normalize();
      const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
      const hgt = Math.sqrt(Math.max(0, L1 * L1 - a * a));
      perp.copy(POLE).addScaledVector(dir, -POLE.dot(dir)).normalize();
      E.copy(S).addScaledVector(dir, a).addScaledVector(perp, hgt);
      setSeg(upR, S, E);
      setSeg(loR, E, T);
      elbowBall.position.copy(E);
      fist.position.copy(T);

      // clignement : rapide, toutes les 2,5 à 5 s
      if (now > this.nextBlink) { this.blinkStart = now; this.nextBlink = now + 2500 + Math.random() * 2500; }
      const bk = (now - (this.blinkStart || -1e9)) / 150;
      const lid = bk >= 0 && bk < 1 ? Math.max(0.06, Math.abs(1 - 2 * bk)) : 1;
      eyeGroups.forEach((eg) => { eg.scale.y = lid; });
      const ts = now * 0.001;
      const hum = 0.82 + 0.12 * (0.5 + 0.5 * Math.sin(ts * 2.1)) + 0.04 * Math.sin(ts * 5.3 + 1.1);
      mouthG.scale.set(1 + (1 - hum) * 0.25, hum, 1);

      // le paysage défile
      const tt = anim ? t : 0;
      for (let k = 0; k < movers.length; k++) {
        const o = movers[k];
        o.g.position.z = ((o.z - tt * o.v) % SPAN + SPAN) % SPAN - SPAN * 0.5;
      }
      for (let k = 0; k < farMovers.length; k++) {
        const o = farMovers[k];
        o.g.position.z = ((o.z - tt * V + FSPAN * 0.5) % FSPAN + FSPAN) % FSPAN - FSPAN * 0.5;
      }
      skyClouds.rotation.y = tt * 0.0012;

      // cheveux souples (ressorts)
      const y = char.position.y;
      const vy = (y - py) / dt;
      const ay = Math.max(-60, Math.min(60, (vy - pvy) / dt));
      const rv = Math.max(-20, Math.min(20, (root.rotation.y - prot) / dt));
      py = y; pvy = vy; prot = root.rotation.y;
      locks.forEach((L) => {
        const drive = (ay * 0.012 + rv * 0.25 - cam.kick * 0.9) * L.k;
        L.v += (-140 * L.a - 6 * L.v + drive * 10) * dt;
        L.a += L.v * dt;
        L.a = Math.max(-0.5, Math.min(0.5, L.a));
        updLock(L);
      });

      { const cv = (this.props.curve ?? 0.6) / 0.6; curveU.value = 0.00006 * cv * cv; }
      renderPP(now);
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  }

  renderVals() {
    const bg = this.props.bg ?? '#1B1636';
    const hex = String(bg).replace('#', '');
    const n = parseInt(hex.length === 3 ? hex.split('').map((c) => c + c).join('') : hex.slice(0, 6), 16) || 0;
    const lum = (0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
    return {
      bg: bg,
      hintColor: lum > 0.55 ? 'rgba(27,22,54,0.72)' : 'rgba(255,255,255,0.75)',
      setCanvas: this.setCanvas,
      onDown: this.onDown,
      onMove: this.onMove,
      onUp: this.onUp
    };
  }
}
</script>
